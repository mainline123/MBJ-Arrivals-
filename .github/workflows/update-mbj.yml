name: Update MBJ Arrivals and Departures

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  update-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch MBJ arrivals and departures
        run: node update-flights.js

      - name: Commit updated flight data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic MBJ arrivals and departures update"
          file_pattern: flights.json departures.json last_updated.txt
