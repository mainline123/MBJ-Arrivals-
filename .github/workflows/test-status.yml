name: Test MBJ Status

on:
  workflow_dispatch:

jobs:
  test-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test MBJ status detection
        run: node test-status.js
