name: Update KIN Flights

on:
  schedule:
    - cron: "20 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update KIN flight data
        run: node update-kin.js

      - name: Commit updated KIN data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kin-arrivals.json kin-departures.json

          if git diff --cached --quiet; then
            echo "No KIN flight changes to commit"
          else
            git commit -m "Automatic KIN flight update"
            git push
          fi
