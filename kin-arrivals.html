<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIN Arrivals</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: #ffffff;
}

.board {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: rgba(4, 24, 38, 0.96);
  border: 2px solid rgba(209, 174, 91, 0.75);
}

.header {
  display: grid;
  grid-template-columns: 1.35fr 1.25fr 0.48fr 0.9fr 1fr;
  align-items: center;
  min-height: 68px;
  padding: 0 14px;
  background: #071d2c;
  border-bottom: 2px solid #c9a85c;
  color: #d9bd78;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.rows {
  flex: 1;
  overflow: hidden;
}

.row {
  display: grid;
  grid-template-columns: 1.35fr 1.25fr 0.48fr 0.9fr 1fr;
  align-items: center;
  min-height: 88px;
  padding: 7px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.14);
}

.row:nth-child(even) {
  background: rgba(255,255,255,0.035);
}

.flight-cell {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.logo-box {
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  border-radius: 7px;
  overflow: hidden;
}

.logo-box img {
  width: 46px;
  height: 46px;
  object-fit: contain;
}

.logo-fallback {
  color: #071d2c;
  font-size: 15px;
  font-weight: 800;
}

.flight-info {
  min-width: 0;
}

.flight-number {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.05;
  white-space: nowrap;
}

.airline-name {
  margin-top: 4px;
  color: #b9c8cf;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.city {
  font-size: 23px;
  font-weight: 700;
  line-height: 1.1;
}

.airport-code {
  margin-top: 4px;
  color: #b9c8cf;
  font-size: 14px;
  font-weight: 600;
}

.baggage {
  font-size: 23px;
  font-weight: 800;
  text-align: center;
}

.scheduled {
  font-size: 23px;
  font-weight: 700;
}

.status-cell {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}

.live-time {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.05;
}

.time-type {
  margin-top: 3px;
  color: #d9bd78;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.status-text {
  margin-top: 3px;
  font-size: 15px;
  font-weight: 700;
}

.status-on-time {
  color: #65d58b;
}

.status-delayed {
  color: #ffb44c;
}

.status-cancelled {
  color: #ff6666;
}

.status-landed,
.status-arrived {
  color: #67c7ff;
}

.status-default {
  color: #ffffff;
}

.update-bar {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5px 10px;
  background: #071d2c;
  border-top: 1px solid rgba(209,174,91,0.65);
  color: #d9bd78;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.4px;
}

.message {
  padding: 30px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
}
</style>
</head>

<body>

<div class="board">

  <div class="header">
    <div>AIRLINE / FLIGHT</div>
    <div>FROM</div>
    <div style="text-align:center;">BAG</div>
    <div>SCHEDULED</div>
    <div>STATUS</div>
  </div>

  <div id="rows" class="rows">
    <div class="message">Loading KIN arrivals...</div>
  </div>

  <div id="updated" class="update-bar">
    LIVE KIN DATA
  </div>

</div>

<script>
const DATA_URL = "kin-arrivals.json";

const AIRLINE_LOGOS = {
  "AA": "AAL",
  "AC": "ACA",
  "AF": "AFR",
  "5Y": "GTI",
  "B6": "JBU",
  "BA": "BAW",
  "BW": "BWA",
  "CM": "CMP",
  "DL": "DAL",
  "DWI": "DWI",
  "JY": "IWY",
  "KX": "CAY",
  "NK": "NKS",
  "TXG": "TXG",
  "UA": "UAL",
  "VS": "VIR"
};

function logoUrl(code) {
  const mapped = AIRLINE_LOGOS[code] || code;

  return "https://raw.githubusercontent.com/npow/airline-codes/master/logos/" +
    mapped + ".png";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function statusClass(status) {
  const s = String(status || "").toLowerCase();

  if (s.includes("cancel")) {
    return "status-cancelled";
  }

  if (s.includes("delay")) {
    return "status-delayed";
  }

  if (s.includes("landed")) {
    return "status-landed";
  }

  if (s.includes("arrived")) {
    return "status-arrived";
  }

  if (s.includes("on time") || s.includes("scheduled")) {
    return "status-on-time";
  }

  return "status-default";
}

function formatUpdated(iso) {
  if (!iso) {
    return "LIVE KIN DATA";
  }

  const date = new Date(iso);

  return "LIVE KIN DATA • UPDATED " +
    date.toLocaleTimeString("en-US", {
      timeZone: "America/Jamaica",
      hour: "numeric",
      minute: "2-digit"
    }) +
    " JAMAICA TIME";
}

function renderFlights(data) {
  const rows = document.getElementById("rows");
  const flights = Array.isArray(data.flights)
    ? data.flights
    : [];

  if (!flights.length) {
    rows.innerHTML =
      '<div class="message">No KIN arrivals currently available.</div>';

    document.getElementById("updated").textContent =
      formatUpdated(data.updated);

    return;
  }

  rows.innerHTML = flights.map(flight => {

    const code = flight.airlineCode || "";
    const flightNumber =
      flight.flight ||
      `${code}${flight.flightNumber || ""}`;

    const city =
      flight.city ||
      flight.airportCode ||
      "—";

    const airportCode =
      flight.airportCode || "";

    const baggage =
      flight.baggage || "—";

    const scheduled =
      flight.scheduledTime || "—";

    const liveTime =
      flight.updatedTime ||
      flight.displayTime ||
      scheduled;

    const timeType =
      flight.timeType || "Scheduled";

    const status =
      flight.status || "Scheduled";

    return `
      <div class="row">

        <div class="flight-cell">

          <div class="logo-box">
            <img
              src="${logoUrl(code)}"
              alt="${escapeHtml(code)}"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block';
              "
            >
            <span
              class="logo-fallback"
              style="display:none;"
            >
              ${escapeHtml(code)}
            </span>
          </div>

          <div class="flight-info">
            <div class="flight-number">
              ${escapeHtml(flightNumber)}
            </div>

            <div class="airline-name">
              ${escapeHtml(flight.airline || "")}
            </div>
          </div>

        </div>

        <div>
          <div class="city">
            ${escapeHtml(city)}
          </div>

          <div class="airport-code">
            ${escapeHtml(airportCode)}
          </div>
        </div>

        <div class="baggage">
          ${escapeHtml(baggage)}
        </div>

        <div class="scheduled">
          ${escapeHtml(scheduled)}
        </div>

        <div class="status-cell">

          <div class="live-time">
            ${escapeHtml(liveTime)}
          </div>

          <div class="time-type">
            ${escapeHtml(timeType)}
          </div>

          <div class="status-text ${statusClass(status)}">
            ${escapeHtml(status)}
          </div>

        </div>

      </div>
    `;
  }).join("");

  document.getElementById("updated").textContent =
    formatUpdated(data.updated);
}

async function loadFlights() {
  try {
    const response = await fetch(
      DATA_URL + "?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const data = await response.json();

    renderFlights(data);

  } catch (error) {
    console.error(
      "KIN arrivals error:",
      error
    );

    document.getElementById("rows").innerHTML =
      '<div class="message">KIN arrival data temporarily unavailable.</div>';
  }
}

loadFlights();

/*
 * Reload our JSON every 60 seconds.
 * GitHub Actions updates the underlying data automatically.
 */
setInterval(loadFlights, 60000);
</script>

</body>
</html>
