<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIN Live Arrivals</title>

<style>

:root {
    --header:#063956;
    --gold:#f3d67a;
    --green:#42e582;
    --orange:#ffbd45;
    --red:#ff6464;
    --cyan:#56c8ff;
    --line:rgba(201,166,75,.22);
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    background:transparent;
    color:white;
    font-family:Arial,"Segoe UI",sans-serif;
}

.board {
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:rgba(4,24,42,.97);

    border:2px solid #c9a64b;
}

.table-wrap {
    flex:1;
    min-height:0;
}

table {
    width:100%;
    height:100%;

    border-collapse:collapse;
    table-layout:fixed;
}

thead {
    height:5%;
}

tbody {
    height:95%;
}

th {
    background:var(--header);
    color:var(--gold);

    font-size:clamp(17px,2vw,31px);
    font-weight:800;

    text-align:left;

    padding:8px;

    border-bottom:2px solid #c9a64b;

    text-transform:uppercase;

    white-space:nowrap;
}

td {
    padding:7px 8px;

    border-bottom:1px solid var(--line);

    font-size:clamp(17px,2.15vw,32px);

    line-height:1.1;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

tbody tr:nth-child(even) {
    background:rgba(255,255,255,.025);
}


/* AIRLINE */

.flight-cell {
    display:flex;
    align-items:center;

    gap:9px;

    width:100%;

    overflow:hidden;
}

.airline-logo {
    width:clamp(40px,4.5vw,66px);
    height:clamp(30px,3.5vw,50px);

    object-fit:contain;

    flex:0 0 auto;

    background:white;

    border-radius:4px;

    padding:2px;
}

.flight-text {
    font-weight:800;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* BAG */

.center {
    text-align:center;
    font-weight:800;
}


/* TIME */

.scheduled {
    color:white;
    font-weight:800;
}


/* STATUS */

.status {
    font-weight:800;
}

.status-time {
    color:white;
    font-weight:800;

    margin-right:6px;
}

.status-on-time,
.status-ontime {
    color:var(--green);
}

.status-early {
    color:#18c6c8;
}

.status-delayed {
    color:var(--orange);
}

.status-cancelled {
    color:var(--red);
}

.status-landed,
.status-arrived {
    color:var(--cyan);
}


/* COLUMN WIDTHS */

.col-flight {
    width:31%;
}

.col-from {
    width:27%;
}

.col-bag {
    width:8%;
}

.col-time {
    width:15%;
}

.col-status {
    width:19%;
}


/* UPDATE BAR */

.update-bar {
    flex:0 0 auto;

    background:var(--header);

    color:var(--gold);

    text-align:right;

    padding:5px 10px;

    font-size:clamp(11px,1.2vw,17px);

    font-weight:700;
}

</style>
</head>


<body>

<div class="board">

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th class="col-flight">
                        AIRLINE / FLIGHT
                    </th>

                    <th class="col-from">
                        FROM
                    </th>

                    <th class="col-bag">
                        BAG
                    </th>

                    <th class="col-time">
                        SCHEDULED
                    </th>

                    <th class="col-status">
                        STATUS
                    </th>

                </tr>

            </thead>

            <tbody id="flightBody">
            </tbody>

        </table>

    </div>


    <div
        class="update-bar"
        id="updated">
        LIVE KIN DATA
    </div>

</div>


<script>

/*
   SALMAN'S EXISTING LIVE KIN DATA
   We are only reading it.
*/

const LIVE_URL =
"https://mainline123.github.io/travis-airports/data/kin-arrivals.json";


/* AIRLINE LOGOS */

const airlineLogos = {

    "AA":"AAL",
    "AC":"ACA",
    "B6":"JBU",
    "BW":"BWA",
    "CM":"CMP",
    "DL":"DAL",
    "DM":"ARA",
    "JY":"IWY",
    "KX":"CAY",
    "NK":"NKS",
    "BA":"BAW",
    "UA":"UAL"

};


const LOGO_BASE =
"https://raw.githubusercontent.com/imgmongelli/airlines-logos-dataset/master/images/";


/* SAFE HTML */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* FIND AIRLINE CODE */

function getAirlineCode(value) {

    const text =
        String(value || "")
        .toUpperCase();

    const match =
        text.match(
            /\b([A-Z0-9]{2})\s*\d{1,4}\b/
        );

    return match
        ? match[1]
        : "";
}


/* GET LOGO */

function getLogo(value) {

    const code =
        getAirlineCode(value);

    const icao =
        airlineLogos[code];

    if(!icao) {
        return "";
    }

    return (
        LOGO_BASE +
        encodeURIComponent(icao) +
        ".png"
    );
}


/* STATUS COLOUR */

function statusClass(status) {

    const value =
        String(status || "")
        .toLowerCase();

    if(value.includes("landed")) {
        return "status-landed";
    }

    if(value.includes("arrived")) {
        return "status-arrived";
    }

    if(value.includes("early")) {
        return "status-early";
    }

    if(value.includes("delay")) {
        return "status-delayed";
    }

    if(value.includes("cancel")) {
        return "status-cancelled";
    }

    if(
        value.includes("on-time") ||
        value.includes("on time")
    ) {
        return "status-on-time";
    }

    return "";
}


/* FORMAT UPDATE TIME */

function formatUpdateTime(value) {

    if(!value) {
        return "";
    }

    const date =
        new Date(value);

    if(isNaN(date.getTime())) {
        return "";
    }

    return new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone:"America/Jamaica",
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }
    ).format(date);
}


/* GET FIELD USING POSSIBLE NAMES */

function getValue(object,names) {

    for(const name of names) {

        if(
            object[name] !== undefined &&
            object[name] !== null &&
            object[name] !== ""
        ) {
            return object[name];
        }
    }

    return "";
}


/* LOAD KIN ARRIVALS */

async function loadFlights() {

    try {

        const response =
            await fetch(
                LIVE_URL +
                "?refresh=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok) {

            throw new Error(
                "Unable to retrieve KIN arrivals"
            );
        }


        const data =
            await response.json();


        const flights =
            (data.flights || [])
            .slice(0,30);


        const body =
            document.getElementById(
                "flightBody"
            );


        body.innerHTML = "";


        flights.forEach(f => {


            const airlineFlight =
                getValue(
                    f,
                    [
                        "airlineFlight",
                        "airline_flight",
                        "flight"
                    ]
                );


            const from =
                getValue(
                    f,
                    [
                        "from",
                        "origin",
                        "arrivingFrom"
                    ]
                );


            const bag =
                getValue(
                    f,
                    [
                        "baggage",
                        "bag",
                        "baggageClaim"
                    ]
                );


            const scheduledTime =
                getValue(
                    f,
                    [
                        "scheduledTime",
                        "scheduled",
                        "time"
                    ]
                );


            const actualTime =
                getValue(
                    f,
                    [
                        "actualTime",
                        "actual",
                        "estimatedTime"
                    ]
                );


            const status =
                getValue(
                    f,
                    [
                        "status",
                        "flightStatus"
                    ]
                ) || "On-Time";


            /*
               STATUS DISPLAY

               Landed / delayed / early:
               show updated time + status.

               On-Time:
               show scheduled time + status.
            */

            const statusTime =
                actualTime ||
                scheduledTime ||
                "";


            const logo =
                getLogo(
                    airlineFlight
                );


            const logoHTML =
                logo

                ? `
                    <img
                        class="airline-logo"
                        src="${logo}"
                        alt=""
                        onerror="
                            this.style.display='none';
                        "
                    >
                  `

                : "";


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    <div class="flight-cell">

                        ${logoHTML}

                        <span class="flight-text">

                            ${escapeHtml(
                                airlineFlight || "—"
                            )}

                        </span>

                    </div>

                </td>


                <td>

                    ${escapeHtml(
                        from || "—"
                    )}

                </td>


                <td class="center">

                    ${escapeHtml(
                        bag || "—"
                    )}

                </td>


                <td class="scheduled">

                    ${escapeHtml(
                        scheduledTime || "—"
                    )}

                </td>


                <td class="status">

                    <span class="status-time">

                        ${escapeHtml(
                            statusTime
                        )}

                    </span>

                    <span class="${statusClass(status)}">

                        ${escapeHtml(
                            status
                        )}

                    </span>

                </td>

            `;


            body.appendChild(row);

        });


        const updateTime =
            formatUpdateTime(
                data.updated
            );


        document
            .getElementById("updated")
            .textContent =

            updateTime

            ? "LIVE KIN DATA UPDATED " +
              updateTime

            : "LIVE KIN DATA";


    }

    catch(error) {

        console.error(
            "KIN arrival update failed:",
            error
        );


        document
            .getElementById("updated")
            .textContent =

            "LIVE KIN DATA — REFRESHING...";

    }

}


/* LOAD NOW */

loadFlights();


/* UPDATE EVERY 60 SECONDS */

setInterval(
    loadFlights,
    60000
);


/* REFRESH WHEN NOVISIGN RETURNS TO PAGE */

document.addEventListener(
    "visibilitychange",
    function() {

        if(!document.hidden) {

            loadFlights();

        }

    }
);

</script>

</body>
</html>
