<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moon Palace MBJ Arrivals</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #071a2d;
    color: white;
    font-family: Arial, "Segoe UI", sans-serif;
}

/* Schedule fills the entire NoviSign placeholder */

.board {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    border: 2px solid #c9a64b;
    background: rgba(4, 24, 42, 0.97);
}

table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

thead {
    height: 5%;
}

tbody {
    height: 95%;
}

th {
    background: #063956;
    color: #f3d67a;
    font-size: clamp(11px, 1.5vw, 22px);
    font-weight: 700;
    text-align: left;
    padding: 8px 7px;
    border-bottom: 2px solid #c9a64b;
    text-transform: uppercase;
    letter-spacing: .4px;
}

td {
    padding: 3px 7px;
    border-bottom: 1px solid rgba(201,166,75,.22);
    font-size: clamp(10px, 1.4vw, 20px);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

tbody tr:nth-child(even) {
    background: rgba(255,255,255,.025);
}

.flight {
    font-weight: 700;
    color: #ffffff;
}

.time {
    font-weight: 700;
    color: #ffffff;
}

.status {
    font-weight: 700;
}

.status-arrived,
.status-landed,
.status-on-time {
    color: #51e38a;
}

.status-delayed {
    color: #ffbd45;
}

.status-cancelled {
    color: #ff6464;
}

.status-en-route,
.status-enroute,
.status-in-air {
    color: #56c8ff;
}

.message {
    text-align: center;
    padding: 30px;
    color: #d6d6d6;
}

/* Column widths */

.col-flight { width: 25%; }
.col-from   { width: 29%; }
.col-bag    { width: 11%; }
.col-time   { width: 17%; }
.col-status { width: 18%; }

</style>
</head>

<body>

<div class="board">

<table>

<thead>
<tr>
    <th class="col-flight">Airline / Flight</th>
    <th class="col-from">From</th>
    <th class="col-bag">Bag</th>
    <th class="col-time">Time</th>
    <th class="col-status">Status</th>
</tr>
</thead>

<tbody id="flight-body">
<tr>
    <td colspan="5" class="message">
        Loading MBJ arrivals...
    </td>
</tr>
</tbody>

</table>

</div>

<script>

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function statusClass(status) {
    return "status-" +
        String(status || "")
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "-");
}

async function loadFlights() {

    const body =
        document.getElementById("flight-body");

    try {

        const response =
            await fetch(
                "flights.json?t=" + Date.now(),
                { cache: "no-store" }
            );

        if (!response.ok) {
            throw new Error("Unable to load flights.json");
        }

        const data = await response.json();

        /* Your MBJ scraper stores arrivals in data.flights */

        const flights =
            (data.flights || []).slice(0, 30);

        body.innerHTML = "";

        if (!flights.length) {

            body.innerHTML = `
                <tr>
                    <td colspan="5" class="message">
                        No arrival information available.
                    </td>
                </tr>
            `;

            return;
        }

        flights.forEach(f => {

            const row =
                document.createElement("tr");

            /*
              If MBJ provides an updated/actual time,
              show that. Otherwise show scheduled time.
            */

            const displayTime =
                f.actualTime ||
                f.scheduledTime ||
                "—";

            const displayStatus =
                f.status || "Scheduled";

            row.innerHTML = `
                <td class="flight">
                    ${escapeHtml(f.airlineFlight || "—")}
                </td>

                <td>
                    ${escapeHtml(f.from || "—")}
                </td>

                <td>
                    ${escapeHtml(f.baggage || "—")}
                </td>

                <td class="time">
                    ${escapeHtml(displayTime)}
                </td>

                <td class="status ${statusClass(displayStatus)}">
                    ${escapeHtml(displayStatus)}
                </td>
            `;

            body.appendChild(row);
        });

    } catch (error) {

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="5" class="message">
                    Flight information temporarily unavailable.
                </td>
            </tr>
        `;
    }
}


/* Load immediately */

loadFlights();


/* Refresh the DISPLAY every 60 seconds.
   This does NOT run the scraper.
   It simply rereads your existing flights.json.
*/

setInterval(loadFlights, 60000);

</script>

</body>
</html>
