<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBJ — ARRIVALS Portrait</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#061726;color:white}.screen{width:100vw;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#073b59,#031827)}header{background:#0b1728;border-bottom:5px solid #f5c62b;padding:2.2vh 4vw 1.8vh;flex:none}.top{display:flex;justify-content:space-between;align-items:center;gap:2vw}.code{font-size:clamp(48px,11vw,105px);font-weight:900;color:#42b8ed;letter-spacing:2px}.clockwrap{text-align:right}.live{display:inline-block;background:#148544;padding:5px 12px;border-radius:18px;font-size:clamp(12px,1.8vw,19px);font-weight:800}.clock{color:#f5c62b;font-size:clamp(25px,5vw,54px);font-weight:900;margin-top:6px}.date{font-size:clamp(12px,1.7vw,20px);color:#b8cede}.airport{font-size:clamp(17px,3.5vw,38px);font-weight:900;line-height:1.15;margin-top:5px}.subtitle{font-size:clamp(17px,3.2vw,34px);color:#f5c62b;font-weight:900;margin-top:8px}.board{flex:1;min-height:0;margin:1.6vh 2.5vw 1vh;border-radius:12px;background:#fff;color:#102b40;overflow:hidden;display:flex;flex-direction:column}.tablehead{background:#0a3d61;color:white;display:grid;grid-template-columns:21% 1fr 21%;padding:1.4vh 2.2vw;gap:1vw;font-weight:900;text-transform:uppercase;font-size:clamp(13px,2.2vw,24px)}.tablehead span:last-child{text-align:right}.rows{flex:1;min-height:0;display:flex;flex-direction:column}.flightrow{flex:1;min-height:0;display:grid;grid-template-columns:21% 1fr 21%;gap:1vw;align-items:center;padding:.5vh 2.2vw;border-bottom:1px solid #dce6ed}.flightrow:nth-child(even){background:#eef6fa}.scheduled{font-size:clamp(15px,2.6vw,29px);font-weight:900;color:#083b5c}.middle{min-width:0}.city{font-size:clamp(17px,2.9vw,32px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flightname{font-size:clamp(12px,1.95vw,22px);font-weight:700;color:#246a91;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.details{text-align:right;min-width:0}.status{font-size:clamp(12px,2vw,23px);font-weight:900;white-space:nowrap}.extra{font-size:clamp(11px,1.75vw,19px);font-weight:800;color:#506c7c;margin-top:4px}.ok{color:#148544}.late{color:#b65b0d}.bad{color:#a82929}.empty{color:#647786}.message{color:#0a3d61;padding:4vh 3vw;font-size:clamp(18px,3vw,30px);font-weight:800;text-align:center}footer{flex:none;display:flex;justify-content:space-between;align-items:center;gap:2vw;padding:1vh 3vw 1.4vh;color:#c9dce8;font-size:clamp(10px,1.5vw,17px)}footer strong{color:#fff}.updated{text-align:right}@media(min-aspect-ratio:1/1){header{padding:1vh 3vw}.board{margin:1vh 2vw}.flightrow{padding:.3vh 2vw}}
</style></head><body><div class="screen"><header><div class="top"><div class="code">MBJ</div><div class="clockwrap"><div class="live" id="sync">● LIVE DATA</div><div class="clock" id="clock">--:--</div><div class="date" id="date">—</div></div></div><div class="airport">SANGSTER INTERNATIONAL AIRPORT</div><div class="subtitle">MONTEGO BAY • ARRIVALS</div></header><main class="board"><div class="tablehead"><span>Scheduled</span><span>Origin / Flight</span><span>Status / Bag</span></div><div class="rows" id="rows"><div class="message">Loading MBJ ARRIVALS…</div></div></main><footer><strong>HALIFAX VIRTUAL MEDIA MASTERS &amp; EVENTS LTD.</strong><div class="updated" id="updated">Loading schedule…</div></footer></div><script>
const FILE='flights.json', PLACE='from', EXTRA='baggage', ROWS_PER_PAGE=10;let flights=[],page=0;const $=id=>document.getElementById(id);function el(tag,cls,value){const n=document.createElement(tag);n.className=cls;n.textContent=value??'—';return n}function render(){const host=$('rows');host.replaceChildren();if(!flights.length){host.appendChild(el('div','message','No flights currently available'));return}const pages=Math.ceil(flights.length/ROWS_PER_PAGE);page%=pages;const shown=flights.slice(page*ROWS_PER_PAGE,(page+1)*ROWS_PER_PAGE);for(const f of shown){const row=el('div','flightrow');row.appendChild(el('div','scheduled',f.scheduledTime||'—'));const middle=el('div','middle');middle.appendChild(el('div','city',f[PLACE]||'—'));middle.appendChild(el('div','flightname',f.airlineFlight||'—'));row.appendChild(middle);const details=el('div','details');const s=(f.status||'—');const cls=/delay/i.test(s)?'late':/cancel/i.test(s)?'bad':/on.time|early|landed|departed/i.test(s)?'ok':'empty';details.appendChild(el('div','status '+cls,s));details.appendChild(el('div','extra',(EXTRA==='gate'?'Gate: ':'Bag: ')+(f[EXTRA]||'—')));row.appendChild(details);host.appendChild(row)}page=(page+1)%pages}
async function load(){try{const response=await fetch(FILE+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.flights))throw Error('Invalid flight data');flights=data.flights;page=0;render();$('sync').textContent='● LIVE DATA';$('sync').style.background='#148544';$('updated').textContent=data.updated?'Updated '+new Date(data.updated).toLocaleTimeString('en-US',{timeZone:'America/Jamaica',hour:'numeric',minute:'2-digit'})+' Jamaica time':'Schedule loaded'}catch(e){console.error(e);$('sync').textContent='DATA UNAVAILABLE';$('sync').style.background='#9b2c2c';if(!flights.length)$('rows').replaceChildren(el('div','message','Unable to load flight data'))}}
function clock(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('en-US',{timeZone:'America/Jamaica',hour:'numeric',minute:'2-digit'});$('date').textContent=now.toLocaleDateString('en-US',{timeZone:'America/Jamaica',weekday:'short',month:'short',day:'numeric'})}clock();load();setInterval(clock,1000);setInterval(()=>{if(flights.length)render()},12000);setInterval(load,300000);
</script></body></html>
