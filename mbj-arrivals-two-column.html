
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBJ Live Arrivals</title>
<style>
:root {
  --navy:#06182c;
  --blue:#0b3153;
  --cyan:#29d8ff;
  --gold:#ffd52e;
  --green:#42e582;
  --muted:#c5d4e1;
  --line:rgba(255,255,255,.18);
}
* {box-sizing:border-box;margin:0;padding:0}
html,body {
  width:100%;height:100%;overflow:hidden;
  background:var(--navy);color:white;
  font-family:Arial,Helvetica,sans-serif;
}
body {display:flex;flex-direction:column}
header {
  height:9%;flex-shrink:0;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:.5vh 2vw;
  background:linear-gradient(120deg,#06182c,#0b3d66);
  border-bottom:.3vh solid var(--gold);
}
.mbj {
  font-size:4vw;font-weight:900;
  color:var(--cyan);line-height:.9;
}
.jamaica {
  color:var(--gold);font-size:1vw;
  letter-spacing:.25em;font-weight:900;
  margin-top:.3vh;
}
.airport {text-align:right}
.airportName {font-size:1.8vw;font-weight:900}
.location {
  font-size:1.05vw;color:var(--gold);
  font-weight:800;margin-top:.2vh;
}
.live {
  color:var(--green);font-size:1vw;
  font-weight:800;margin-top:.2vh;
}
.topline {
  height:7%;flex-shrink:0;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 2vw;background:var(--blue);
  border-bottom:.3vh solid var(--cyan);
}
.topline h1 {font-size:2.8vw;letter-spacing:.06em}
.clock {
  color:var(--gold);font-size:2vw;
  font-weight:900;
}
.date {font-size:1vw;color:var(--muted)}
.boards {
  flex:1;min-height:0;display:grid;
  grid-template-columns:1fr 1fr;
  gap:.8vw;padding:.8vh 1vw;
}
.board {
  min-height:0;display:flex;
  flex-direction:column;
  border:1px solid var(--line);
  border-radius:.5vw;overflow:hidden;
  background:#09243d;
}
.columnHeader,.flightRow {
  display:grid;align-items:center;
  grid-template-columns:1.65fr 1.2fr .45fr .85fr 1fr;
  column-gap:.15vw;
}
.columnHeader {
  height:6%;flex-shrink:0;
  background:#0d4770;color:var(--cyan);
  font-size:.95vw;font-weight:900;
}
.columnHeader>div,.flightRow>div {
  min-width:0;overflow:hidden;
  padding:0 .25vw;
  text-overflow:ellipsis;white-space:nowrap;
}
.flightRows {
  flex:1;min-height:0;
  display:flex;flex-direction:column;
}
.flightRow {
  flex:1;min-height:0;
  font-size:1.05vw;font-weight:800;
  border-bottom:1px solid var(--line);
}
.flightRow:nth-child(even) {
  background:rgba(36,145,213,.18);
}
.flightRow:nth-child(odd) {
  background:rgba(255,255,255,.025);
}
.airlineCell {
  display:flex;align-items:center;gap:.35vw;
}
.logoBox {
  width:1.8vw;height:1.8vw;
  flex-shrink:0;border-radius:.25vw;
  background:white;display:flex;
  align-items:center;justify-content:center;
  overflow:hidden;padding:.1vw;
}
.airlineLogo {
  width:100%;height:100%;object-fit:contain;
}
.codeBadge {
  display:none;color:#08243d;
  font-size:.8vw;font-weight:900;
}
.flightText {
  min-width:0;overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:center;
  line-height:1.08;
}
.airlineName {
  color:#fff;font-size:.92vw;
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.flightCode {
  color:var(--cyan);font-size:1.04vw;
  font-weight:900;
}
.number {text-align:center}
.time {color:var(--gold)}
.status {color:var(--green)}
.empty {
  flex:1;display:flex;align-items:center;
  justify-content:center;
  color:var(--muted);font-size:1.6vw;
}
footer {
  height:4%;flex-shrink:0;
  display:flex;justify-content:space-between;
  align-items:center;padding:0 1.5vw;
  border-top:1px solid var(--line);
  color:var(--muted);font-size:.9vw;
}
.footerCenter {color:var(--cyan);font-weight:900}
.footerRight {color:white}
.pageInfo {color:var(--gold);font-weight:900}
</style>
</head>
<body>
<header>
  <div>
    <div class="mbj">MBJ</div>
    <div class="jamaica">JAMAICA</div>
  </div>
  <div class="airport">
    <div class="airportName">SANGSTER INTERNATIONAL AIRPORT</div>
    <div class="location">MONTEGO BAY • JAMAICA</div>
    <div class="live">● LIVE FLIGHT INFORMATION</div>
  </div>
</header>

<div class="topline">
  <h1>ARRIVALS ✈</h1>
  <div style="text-align:right">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
</div>

<main class="boards">
  <section class="board">
    <div class="columnHeader">
      <div>AIRLINE / FLIGHT</div>
      <div>FROM</div>
      <div>BAG</div>
      <div>TIME</div>
      <div>ACTUAL / STATUS</div>
    </div>
    <div class="flightRows" id="leftFlights"></div>
  </section>
  <section class="board">
    <div class="columnHeader">
      <div>AIRLINE / FLIGHT</div>
      <div>FROM</div>
      <div>BAG</div>
      <div>TIME</div>
      <div>ACTUAL / STATUS</div>
    </div>
    <div class="flightRows" id="rightFlights"></div>
  </section>
</main>

<footer>
  <div>Sangster International Airport</div>
  <div class="footerCenter">
    HALIFAX VIRTUAL MEDIA MASTERS &amp; EVENTS LTD.
  </div>
  <div class="pageInfo" id="pageInfo">ARRIVALS</div>
  <div class="footerRight" id="updated">Loading...</div>
</footer>

<script>
const MAX_ROWS=30;
const KEEP_PREVIOUS=4;

const AIRLINES={
  "AA":"AAL","B6":"JBU","AC":"ACA",
  "WS":"WJA","DL":"DAL","UA":"UAL",
  "WN":"SWA","BA":"BAW","NK":"NKS",
  "F9":"FFT","CM":"CMP","TS":"TSC",
  "WG":"SWG","BW":"BWA","VS":"VIR",
  "BY":"TOM","OR":"TFL","SY":"SCX",
  "5Y":"GTI"
};

const AIRLINE_NAMES={
  "AA":"American Airlines",
  "B6":"JetBlue",
  "AC":"Air Canada",
  "WS":"WestJet",
  "DL":"Delta",
  "UA":"United Airlines",
  "WN":"Southwest",
  "BA":"British Airways",
  "NK":"Spirit",
  "F9":"Frontier",
  "CM":"Copa Airlines",
  "TS":"Air Transat",
  "WG":"Sunwing",
  "BW":"Caribbean Airlines",
  "VS":"Virgin Atlantic",
  "BY":"TUI Airways",
  "OR":"TUI fly",
  "SY":"Sun Country",
  "5Y":"Atlas Air",
  "P5":"Wingo",
  "LP":"LATAM Airlines Peru",
  "NO":"Neos"
};

const LOCAL_LOGOS={
  "P5":"airline-logos/wingo.svg",
  "LP":"airline-logos/latam.jpg",
  "NO":"airline-logos/neos.jpg"
};

const LOGO_BASE=
  "https://raw.githubusercontent.com/imgmongelli/airlines-logos-dataset/master/images/";

function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getFlightNumber(text){
  const match=String(text||"").toUpperCase()
    .match(/\b([A-Z0-9]{2})\s*(\d{1,4}[A-Z]?)\b/);
  return match?match[1]+match[2]:"";
}

function getAirlineCode(text){
  const number=getFlightNumber(text);
  return number?number.slice(0,2):"";
}

function airlineDisplay(airlineFlight){
  const raw=String(airlineFlight||"—");
  const code=getAirlineCode(raw);
  const number=getFlightNumber(raw);

  const originalName=number
    ?raw.replace(
      new RegExp("\\b"+number.slice(0,2)+"\\s*"+
        number.slice(2)+"\\b","i"),""
    ).trim()
    :raw;

  const airlineName=AIRLINE_NAMES[code]||
    originalName||raw;

  const textHTML=number
    ?`<div class="flightText">
        <div class="airlineName">${escapeHTML(airlineName)}</div>
        <div class="flightCode">${escapeHTML(number)}</div>
      </div>`
    :`<div class="flightText">
        <div class="airlineName">${escapeHTML(raw)}</div>
      </div>`;

  const logoURL=LOCAL_LOGOS[code]||
    (AIRLINES[code]
      ?LOGO_BASE+encodeURIComponent(AIRLINES[code])+".png"
      :"");

  if(!logoURL)return textHTML;

  return `<div class="logoBox">
    <img class="airlineLogo"
      src="${escapeHTML(logoURL)}"
      alt="${escapeHTML(airlineName)}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="codeBadge">${escapeHTML(code)}</div>
  </div>${textHTML}`;
}

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    new Intl.DateTimeFormat("en-US",{
      timeZone:"America/Jamaica",
      hour:"numeric",minute:"2-digit",
      second:"2-digit",hour12:true
    }).format(now);

  document.getElementById("date").textContent=
    new Intl.DateTimeFormat("en-US",{
      timeZone:"America/Jamaica",
      weekday:"short",month:"short",
      day:"numeric",year:"numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock,1000);

function jamaicaMinutesNow(){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:"America/Jamaica",
    hour:"numeric",minute:"2-digit",
    hour12:false
  }).formatToParts(new Date());

  const hour=Number(
    parts.find(p=>p.type==="hour")?.value||0
  );
  const minute=Number(
    parts.find(p=>p.type==="minute")?.value||0
  );
  return (hour%24)*60+minute;
}

function flightTimeMinutes(timeString){
  if(!timeString)return null;
  const match=String(timeString).trim()
    .match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

  if(!match)return null;

  let hour=Number(match[1]);
  const minute=Number(match[2]);

  if(hour===12)hour=0;
  if(match[3].toUpperCase()==="PM")hour+=12;

  return hour*60+minute;
}

function getCurrentFlights(allFlights){
  const flights=Array.isArray(allFlights)
    ?allFlights:[];

  if(flights.length<=MAX_ROWS)return flights;

  const now=jamaicaMinutesNow();
  let nextIndex=flights.findIndex(f=>{
    const mins=flightTimeMinutes(f.scheduledTime);
    return mins!==null&&mins>=now;
  });

  if(nextIndex===-1){
    return flights.slice(-MAX_ROWS);
  }

  let start=Math.max(0,nextIndex-KEEP_PREVIOUS);

  if(start+MAX_ROWS>flights.length){
    start=Math.max(0,flights.length-MAX_ROWS);
  }

  return flights.slice(start,start+MAX_ROWS);
}

function makeRows(items){
  if(!items.length){
    return '<div class="empty">No flights to display</div>';
  }

  return items.map(f=>{
    const displayStatus=f.actualTime||f.status||"—";

    return `<div class="flightRow">
      <div class="airlineCell">
        ${airlineDisplay(f.airlineFlight)}
      </div>
      <div>${escapeHTML(f.from||"—")}</div>
      <div class="number">
        ${escapeHTML(f.baggage||"—")}
      </div>
      <div class="time">
        ${escapeHTML(f.scheduledTime||"—")}
      </div>
      <div class="status">
        ${escapeHTML(displayStatus)}
      </div>
    </div>`;
  }).join("");
}

function renderFlights(allFlights){
  const flights=getCurrentFlights(allFlights);
  const midpoint=Math.ceil(flights.length/2);

  document.getElementById("leftFlights").innerHTML=
    makeRows(flights.slice(0,midpoint));

  document.getElementById("rightFlights").innerHTML=
    makeRows(flights.slice(midpoint));

  document.getElementById("pageInfo").textContent=
    `${flights.length} FLIGHTS`;
}

async function loadFlights(){
  try{
    const response=await fetch(
      `flights.json?t=${Date.now()}`,
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Unable to retrieve arrivals");
    }

    const data=await response.json();
    renderFlights(data.flights||[]);

    if(data.updated){
      const updatedDate=new Date(data.updated);
      if(!isNaN(updatedDate.getTime())){
        document.getElementById("updated").textContent=
          "UPDATED "+
          new Intl.DateTimeFormat("en-US",{
            timeZone:"America/Jamaica",
            hour:"numeric",minute:"2-digit",
            hour12:true
          }).format(updatedDate);
      }
    }
  }catch(error){
    console.error(error);
    document.getElementById("updated").textContent=
      "UPDATE UNAVAILABLE";
  }
}

loadFlights();
setInterval(loadFlights,300000);
</script>
</body>
</html>
