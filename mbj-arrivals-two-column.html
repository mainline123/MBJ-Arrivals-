
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBJ Live Arrivals - 36 Flights</title>
<style>
:root {
  --navy:#06182c;
  --blue:#0b3153;
  --cyan:#29d8ff;
  --gold:#ffd52e;
  --green:#42e582;
  --muted:#c5d4e1;
  --line:rgba(255,255,255,.18);
}
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html,body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--navy);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}
body {
  display:flex;
  flex-direction:column;
}
header {
  height:8%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.35vh 2vw;
  background:linear-gradient(120deg,#06182c,#0b3d66);
  border-bottom:.25vh solid var(--gold);
}
.mbj {
  font-size:3.5vw;
  font-weight:900;
  color:var(--cyan);
  line-height:.9;
}
.jamaica {
  color:var(--gold);
  font-size:.85vw;
  letter-spacing:.25em;
  font-weight:900;
  margin-top:.3vh;
}
.airport {
  text-align:right;
}
.airportName {
  font-size:1.65vw;
  font-weight:900;
}
.location {
  font-size:.95vw;
  color:var(--gold);
  font-weight:800;
  margin-top:.2vh;
}
.live {
  color:var(--green);
  font-size:.9vw;
  font-weight:800;
  margin-top:.2vh;
}
.topline {
  height:6%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 2vw;
  background:var(--blue);
  border-bottom:.25vh solid var(--cyan);
}
.topline h1 {
  font-size:2.45vw;
  letter-spacing:.06em;
}
.clock {
  color:var(--gold);
  font-size:1.8vw;
  font-weight:900;
}
.date {
  font-size:.9vw;
  color:var(--muted);
}
.boards {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:.65vw;
  padding:.5vh .8vw;
}
.board {
  min-height:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  border:1px solid var(--line);
  border-radius:.4vw;
  overflow:hidden;
  background:#09243d;
}
.columnHeader,
.flightRow {
  display:grid;
  align-items:center;
  grid-template-columns:
    minmax(0,1.8fr)
    minmax(0,1.2fr)
    minmax(0,.4fr)
    minmax(0,.85fr)
    minmax(0,.95fr);
  column-gap:.1vw;
}
.columnHeader {
  height:5%;
  flex-shrink:0;
  background:#0d4770;
  color:var(--cyan);
  font-size:.83vw;
  font-weight:900;
}
.columnHeader>div,
.flightRow>div {
  min-width:0;
  overflow:hidden;
  padding:0 .2vw;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.flightRows {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.flightRow {
  flex:1 1 0;
  min-height:0;
  font-size:1vw;
  font-weight:800;
  border-bottom:1px solid var(--line);
}
.flightRow:nth-child(even) {
  background:rgba(36,145,213,.18);
}
.flightRow:nth-child(odd) {
  background:rgba(255,255,255,.025);
}
.airlineCell {
  display:flex;
  align-items:center;
}
.flightText {
  min-width:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  line-height:1.1;
}
.airlineName {
  color:white;
  font-size:1vw;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.flightCode {
  color:var(--cyan);
  font-size:1.15vw;
  font-weight:900;
}
.number {
  text-align:center;
}
.time {
  color:var(--gold);
}
.status {
  color:var(--green);
}
.empty {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:1.4vw;
}
footer {
  height:3.5%;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 1.2vw;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:.8vw;
}
.footerCenter {
  color:var(--cyan);
  font-weight:900;
}
.footerRight {
  color:white;
}
.pageInfo {
  color:var(--gold);
  font-weight:900;
}
</style>
</head>
<body>

<header>
  <div>
    <div class="mbj">MBJ</div>
    <div class="jamaica">JAMAICA</div>
  </div>
  <div class="airport">
    <div class="airportName">
      SANGSTER INTERNATIONAL AIRPORT
    </div>
    <div class="location">
      MONTEGO BAY • JAMAICA
    </div>
    <div class="live">
      ● LIVE FLIGHT INFORMATION
    </div>
  </div>
</header>

<div class="topline">
  <h1>ARRIVALS ✈</h1>
  <div style="text-align:right">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
</div>

<main class="boards">
  <section class="board">
    <div class="columnHeader">
      <div>AIRLINE / FLIGHT</div>
      <div>FROM</div>
      <div>BAG</div>
      <div>TIME</div>
      <div>ACTUAL</div>
    </div>
    <div class="flightRows" id="leftFlights"></div>
  </section>

  <section class="board">
    <div class="columnHeader">
      <div>AIRLINE / FLIGHT</div>
      <div>FROM</div>
      <div>BAG</div>
      <div>TIME</div>
      <div>ACTUAL</div>
    </div>
    <div class="flightRows" id="rightFlights"></div>
  </section>
</main>

<footer>
  <div>Sangster International Airport</div>
  <div class="footerCenter">
    HALIFAX VIRTUAL MEDIA MASTERS &amp; EVENTS LTD.
  </div>
  <div class="pageInfo" id="pageInfo">ARRIVALS</div>
  <div class="footerRight" id="updated">Loading...</div>
</footer>

<script>
const MAX_ROWS=36;
const ROWS_PER_COLUMN=18;
const KEEP_PREVIOUS=4;

const AIRLINE_NAMES={
  "AA":"American Airlines",
  "B6":"JetBlue",
  "AC":"Air Canada",
  "WS":"WestJet",
  "DL":"Delta",
  "UA":"United Airlines",
  "WN":"Southwest",
  "BA":"British Airways",
  "NK":"Spirit",
  "F9":"Frontier",
  "CM":"Copa Airlines",
  "TS":"Air Transat",
  "WG":"Sunwing",
  "BW":"Caribbean Airlines",
  "VS":"Virgin Atlantic",
  "BY":"TUI Airways",
  "OR":"TUI fly",
  "SY":"Sun Country",
  "5Y":"Atlas Air",
  "P5":"Wingo",
  "LP":"LATAM Airlines Peru",
  "NO":"Neos"
};

function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getFlightNumber(text){
  const match=String(text||"").toUpperCase()
    .match(/\b([A-Z0-9]{2})\s*(\d{1,4}[A-Z]?)\b/);
  return match?match[1]+match[2]:"";
}

function airlineDisplay(airlineFlight){
  const raw=String(airlineFlight||"—");
  const number=getFlightNumber(raw);
  const code=number?number.slice(0,2):"";

  const originalName=number
    ?raw.replace(
      new RegExp(
        "\\b"+number.slice(0,2)+"\\s*"+
        number.slice(2)+"\\b","i"
      ),""
    ).trim()
    :raw;

  const airlineName=AIRLINE_NAMES[code]||
    originalName||raw;

  if(!number){
    return `<div class="flightText">
      <div class="airlineName">
        ${escapeHTML(raw)}
      </div>
    </div>`;
  }

  return `<div class="flightText">
    <div class="airlineName">
      ${escapeHTML(airlineName)}
    </div>
    <div class="flightCode">
      ${escapeHTML(number)}
    </div>
  </div>`;
}

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    new Intl.DateTimeFormat("en-US",{
      timeZone:"America/Jamaica",
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    }).format(now);

  document.getElementById("date").textContent=
    new Intl.DateTimeFormat("en-US",{
      timeZone:"America/Jamaica",
      weekday:"short",
      month:"short",
      day:"numeric",
      year:"numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock,1000);

function jamaicaMinutesNow(){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:"America/Jamaica",
    hour:"numeric",
    minute:"2-digit",
    hour12:false
  }).formatToParts(new Date());

  const hour=Number(
    parts.find(p=>p.type==="hour")?.value||0
  );
  const minute=Number(
    parts.find(p=>p.type==="minute")?.value||0
  );

  return (hour%24)*60+minute;
}

function flightTimeMinutes(timeString){
  if(!timeString)return null;

  const match=String(timeString).trim()
    .match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);

  if(!match)return null;

  let hour=Number(match[1]);
  const minute=Number(match[2]);

  if(hour===12)hour=0;
  if(match[3].toUpperCase()==="PM")hour+=12;

  return hour*60+minute;
}

function getCurrentFlights(allFlights){
  const flights=Array.isArray(allFlights)
    ?allFlights:[];

  if(flights.length<=MAX_ROWS){
    return flights;
  }

  const now=jamaicaMinutesNow();

  let nextIndex=flights.findIndex(f=>{
    const mins=flightTimeMinutes(f.scheduledTime);
    return mins!==null&&mins>=now;
  });

  if(nextIndex===-1){
    return flights.slice(-MAX_ROWS);
  }

  let start=Math.max(0,nextIndex-KEEP_PREVIOUS);

  if(start+MAX_ROWS>flights.length){
    start=Math.max(0,flights.length-MAX_ROWS);
  }

  return flights.slice(start,start+MAX_ROWS);
}

function makeRows(items){
  if(!items.length){
    return '<div class="empty">No flights to display</div>';
  }

  return items.map(f=>{
    const displayStatus=
      f.actualTime||f.status||"—";

    return `<div class="flightRow">
      <div class="airlineCell">
        ${airlineDisplay(f.airlineFlight)}
      </div>
      <div>${escapeHTML(f.from||"—")}</div>
      <div class="number">
        ${escapeHTML(f.baggage||"—")}
      </div>
      <div class="time">
        ${escapeHTML(f.scheduledTime||"—")}
      </div>
      <div class="status">
        ${escapeHTML(displayStatus)}
      </div>
    </div>`;
  }).join("");
}

function renderFlights(allFlights){
  const flights=getCurrentFlights(allFlights);

  document.getElementById("leftFlights").innerHTML=
    makeRows(flights.slice(0,ROWS_PER_COLUMN));

  document.getElementById("rightFlights").innerHTML=
    makeRows(flights.slice(ROWS_PER_COLUMN,MAX_ROWS));

  document.getElementById("pageInfo").textContent=
    `${flights.length} FLIGHTS`;
}

async function loadFlights(){
  try{
    const response=await fetch(
      `flights.json?t=${Date.now()}`,
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Unable to retrieve arrivals");
    }

    const data=await response.json();
    renderFlights(data.flights||[]);

    if(data.updated){
      const updatedDate=new Date(data.updated);

      if(!isNaN(updatedDate.getTime())){
        document.getElementById("updated").textContent=
          "UPDATED "+
          new Intl.DateTimeFormat("en-US",{
            timeZone:"America/Jamaica",
            hour:"numeric",
            minute:"2-digit",
            hour12:true
          }).format(updatedDate);
      }
    }
  }catch(error){
    console.error(error);
    document.getElementById("updated").textContent=
      "UPDATE UNAVAILABLE";
  }
}

loadFlights();
setInterval(loadFlights,300000);
</script>
</body>
</html>
