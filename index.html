<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBJ Live Arrivals</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #031827;
  color: white;
}

body {
  overflow: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
  background:
    linear-gradient(180deg, #063652 0%, #031827 100%);
}

/* COMPANY */

.brand {
  background: white;
  color: #111;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  margin-bottom: 15px;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

.brandMain {
  font-size: 24px;
  font-weight: 900;
}

.brandSub {
  font-size: 15px;
  font-weight: 900;
  color: #333;
  margin-top: 2px;
}

/* AIRPORT HEADER */

.headerCard {
  background: rgba(10,61,97,.65);
  border: 2px solid #0b5d8c;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.code {
  font-size: 54px;
  font-weight: 900;
  line-height: 1;
}

.airportName {
  font-size: 16px;
  font-weight: 900;
  margin-top: 5px;
}

.location {
  color: #f5c62b;
  font-size: 14px;
  font-weight: 900;
  margin-top: 3px;
}

.liveBadge {
  background: #148544;
  padding: 6px 12px;
  border-radius: 16px;
  font-weight: 900;
  font-size: 13px;
  text-align: center;
}

.clock {
  font-size: 26px;
  font-weight: 900;
  margin-top: 7px;
  text-align: right;
}

.date {
  font-size: 12px;
  color: #c3dae8;
  text-align: right;
}

/* TABLE */

.tableContainer {
  flex: 1;
  min-height: 0;
  background: white;
  color: #102737;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 6px 18px rgba(0,0,0,.5);
}

.tableHead {
  background: #0a3d61;
  color: white;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;

  padding: 12px 10px;

  display: grid;

  grid-template-columns:
    .9fr
    1.45fr
    1.45fr
    .65fr
    .9fr;
}

.tableBody {
  flex: 1;
  overflow-y: auto;
}

.flightRow {
  display: grid;

  grid-template-columns:
    .9fr
    1.45fr
    1.45fr
    .65fr
    .9fr;

  align-items: center;

  padding: 12px 10px;

  border-bottom: 1px solid #d9e4eb;

  font-size: 14px;
  font-weight: 700;
}

.flightRow:nth-child(even) {
  background: #eef6fa;
}

.time {
  color: #082f4e;
  font-weight: 900;
}

.flight {
  color: #0b5d8c;
  font-weight: 900;
}

.from {
  color: #222;
  font-weight: 800;
}

.baggage {
  text-align: center;
  color: #0a3d61;
  font-weight: 900;
}

.actual {
  color: #15743f;
  font-weight: 900;
}

.loading {
  padding: 30px;
  text-align: center;
  color: #0a3d61;
  font-weight: bold;
}

/* FOOTER */

.footer {
  margin-top: 15px;
  padding: 8px 5px;

  display: flex;
  justify-content: space-between;

  font-size: 12px;
  color: #cbe0ed;
}

.updated {
  text-align: right;
}
</style>
</head>

<body>

<div class="screen">

  <div class="brand">
    <div class="brandMain">
      HALIFAX VIRTUAL MEDIA MASTERS
    </div>

    <div class="brandSub">
      &amp; EVENTS LTD.
    </div>
  </div>


  <div class="headerCard">

    <div>
      <div class="code">MBJ</div>

      <div class="airportName">
        SANGSTER INTERNATIONAL AIRPORT
      </div>

      <div class="location">
        MONTEGO BAY • JAMAICA
      </div>
    </div>


    <div>

      <div class="liveBadge" id="syncStatus">
        ● LIVE ARRIVALS
      </div>

      <div class="clock" id="clock">
        --:--
      </div>

      <div class="date" id="date">
        --
      </div>

    </div>

  </div>


  <div class="tableContainer">

    <div class="tableHead">

      <div>Scheduled</div>

      <div>Flight</div>

      <div>Origin</div>

      <div style="text-align:center">
        Bag
      </div>

      <div>Actual</div>

    </div>


    <div
      class="tableBody"
      id="flightData">

      <div class="loading">
        Loading MBJ Arrivals...
      </div>

    </div>

  </div>


  <div class="footer">

    <div>
      <strong>
        Sangster International Airport
      </strong>
    </div>

    <div
      class="updated"
      id="lastUpdated">

      Loading latest schedule...

    </div>

  </div>

</div>


<script>

/*
   flights.json is created by our
   GitHub Action from the official
   MBJ Airport arrivals page.
*/

async function loadFlights() {

  const container =
    document.getElementById("flightData");

  const badge =
    document.getElementById("syncStatus");

  const updated =
    document.getElementById("lastUpdated");

  try {

    /*
       Timestamp prevents the kiosk/browser
       from showing an old cached JSON file.
    */

    const response =
      await fetch(
        "flights.json?t=" + Date.now(),
        { cache: "no-store" }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    if (
      !data.flights ||
      !Array.isArray(data.flights)
    ) {
      throw new Error(
        "Invalid flight data"
      );
    }


    container.innerHTML = "";


    for (const flight of data.flights) {

      const row =
        document.createElement("div");

      row.className =
        "flightRow";


      const scheduled =
        flight.scheduledTime || "—";

      const airlineFlight =
        flight.airlineFlight || "—";

      const origin =
        flight.from || "—";

      const baggage =
        flight.baggage || "—";

      const actual =
        flight.actualTime || "—";


      row.innerHTML = `

        <div class="time">
          ${scheduled}
        </div>

        <div class="flight">
          ${airlineFlight}
        </div>

        <div class="from">
          ${origin}
        </div>

        <div class="baggage">
          ${baggage}
        </div>

        <div class="actual">
          ${actual}
        </div>

      `;


      container.appendChild(row);
    }


    badge.textContent =
      "● LIVE ARRIVALS";

    badge.style.background =
      "#148544";


    if (data.updated) {

      const updateDate =
        new Date(data.updated);

      updated.textContent =
        "Data updated " +
        updateDate.toLocaleTimeString(
          "en-US",
          {
            timeZone:
              "America/Jamaica",

            hour:
              "numeric",

            minute:
              "2-digit"
          }
        ) +
        " Jamaica time";

    }

  }

  catch (error) {

    console.error(
      "Flight data error:",
      error
    );

    badge.textContent =
      "DATA UNAVAILABLE";

    badge.style.background =
      "#9b2c2c";

    container.innerHTML = `

      <div class="loading">

        Unable to load the latest
        MBJ arrivals.

      </div>

    `;

  }

}


/*
   Jamaica clock
*/

function updateClock() {

  const now =
    new Date();

  document
    .getElementById("clock")
    .textContent =
      now.toLocaleTimeString(
        "en-US",
        {
          timeZone:
            "America/Jamaica",

          hour:
            "numeric",

          minute:
            "2-digit"
        }
      );


  document
    .getElementById("date")
    .textContent =
      now.toLocaleDateString(
        "en-US",
        {
          timeZone:
            "America/Jamaica",

          weekday:
            "short",

          month:
            "short",

          day:
            "numeric"
        }
      );

}


/*
   Start board
*/

updateClock();

loadFlights();


/*
   Clock refreshes every second.
*/

setInterval(
  updateClock,
  1000
);


/*
   Re-read flights.json every
   five minutes.

   This costs nothing on Apify.
   It simply checks GitHub for
   the newest JSON file.
*/

setInterval(
  loadFlights,
  300000
);

</script>

</body>
</html>
