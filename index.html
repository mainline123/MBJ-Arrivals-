<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBJ Live Arrivals</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #031827;
  color: #fff;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg,#063652 0%,#031827 100%);
}

/* COMPACT HEADER */
.header {
  height: 15vh;
  min-height: 15vh;
  display: grid;
  grid-template-columns: 27% 47% 26%;
  align-items: center;
  padding: 1.2vh 3vw;
  background: #07182c;
  border-bottom: 4px solid #f7c928;
}

.code {
  font-size: 7.5vh;
  font-weight: 900;
  line-height: .9;
  color: #3cc4f1;
}

.airportName {
  font-size: 2.25vh;
  line-height: 1.05;
  font-weight: 900;
}

.location {
  margin-top: .7vh;
  color: #f7c928;
  font-size: 1.45vh;
  line-height: 1.2;
  font-weight: 900;
}

.right {
  text-align: right;
}

.liveBadge {
  display: inline-block;
  padding: .55vh 1.5vw;
  border-radius: 25px;
  background: #159447;
  font-size: 1.25vh;
  font-weight: 900;
}

.clock {
  margin-top: .7vh;
  color: #f7c928;
  font-size: 3.3vh;
  line-height: 1;
  font-weight: 900;
}

.date {
  margin-top: .45vh;
  color: #d4e2ec;
  font-size: 1.15vh;
}

/* ARRIVALS BAR */
.arrivalsBar {
  height: 6vh;
  min-height: 6vh;
  padding: 0 3vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #064d63;
  border-bottom: 3px solid #f7c928;
}

.arrivalsBar h1 {
  font-size: 3vh;
  font-weight: 900;
  letter-spacing: .04em;
}

.welcome {
  text-align: right;
  color: #f7c928;
  font-size: 1.25vh;
  font-weight: 900;
  line-height: 1.2;
}

/* BOARD */
.board {
  flex: 1;
  min-height: 0;
  margin: 1.2vh 2.5vw 1vh;
  overflow: hidden;
  border-radius: 14px;
  background: #fff;
  display: flex;
  flex-direction: column;
}

/*
   FLIGHT gets the most room.
   FROM gets the second-most.
*/
.tableHead,
.flightRow {
  display: grid;
  grid-template-columns: 1.75fr 1.85fr .80fr 1.05fr 1.05fr;
}

.tableHead {
  height: 4.5vh;
  min-height: 4.5vh;
  padding: 0 1.8vw;
  align-items: center;
  background: #0a4d73;
  font-size: 1.05vh;
  font-weight: 900;
  text-transform: uppercase;
}

.tableBody {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
}

.flightRow {
  min-height: 5.15vh;
  padding: .45vh 1.8vw;
  align-items: center;
  border-bottom: 1px solid #d5e1e8;
  color: #092d47;
  font-size: 1.25vh;
  font-weight: 800;
}

.flightRow:nth-child(even) {
  background: #eaf4f8;
}

.flight {
  color: #08709d;
  font-weight: 900;
}

.origin {
  color: #111;
  font-weight: 800;
}

.bag {
  text-align: center;
  font-weight: 900;
}

.time {
  font-weight: 900;
  color: #092d47;
}

.status {
  color: #07813e;
  font-weight: 900;
}

.loading {
  padding: 4vh 2vw;
  text-align: center;
  color: #0a4d73;
  font-size: 1.6vh;
  font-weight: 900;
}

/* FOOTER */
.footer {
  height: 5vh;
  min-height: 5vh;
  padding: 0 3vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #061625;
  border-top: 3px solid #f7c928;
}

.footerLeft {
  color: #f7c928;
  font-size: 1.2vh;
  font-weight: 900;
}

.footerRight {
  color: #a9c1d0;
  font-size: 1vh;
  text-align: right;
}
</style>
</head>

<body>

<div class="screen">

  <div class="header">

    <div class="code">MBJ</div>

    <div>
      <div class="airportName">
        SANGSTER<br>
        INTERNATIONAL<br>
        AIRPORT
      </div>

      <div class="location">
        MONTEGO BAY • JAMAICA
      </div>
    </div>

    <div class="right">
      <div class="liveBadge">● LIVE DATA</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">--</div>
    </div>

  </div>

  <div class="arrivalsBar">

    <h1>ARRIVALS</h1>

    <div class="welcome">
      WELCOME TO<br>JAMAICA
    </div>

  </div>

  <div class="board">

    <div class="tableHead">
      <div>FLIGHT</div>
      <div>FROM</div>
      <div style="text-align:center;">BAGGAGE</div>
      <div>TIME</div>
      <div>STATUS</div>
    </div>

    <div class="tableBody" id="flightData">
      <div class="loading">
        Loading MBJ arrivals...
      </div>
    </div>

  </div>

  <div class="footer">

    <div class="footerLeft">
      🇯🇲 ONE LOVE • JAMAICA
    </div>

    <div class="footerRight" id="updated">
      Flight information loading...
    </div>

  </div>

</div>

<script>

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-US", {
      timeZone: "America/Jamaica",
      hour: "numeric",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-US", {
      timeZone: "America/Jamaica",
      weekday: "short",
      month: "short",
      day: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);


async function loadFlights() {

  const container = document.getElementById("flightData");

  try {

    const response =
      await fetch("flights.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Unable to load flights.json");
    }

    const data = await response.json();
    const flights = data.flights || [];

    if (!flights.length) {
      container.innerHTML =
        '<div class="loading">No arrivals currently listed.</div>';
      return;
    }

    container.innerHTML = flights.map(f => {

      /*
       Keep MBJ terminology:
       scheduledTime = TIME
       actualTime = STATUS field returned by MBJ
      */

      const flight =
        f.airlineFlight || f.flight || "--";

      const origin =
        f.from || f.origin || "--";

      const bag =
        f.baggage || f.bag || "—";

      const time =
        f.scheduledTime || f.time || "—";

      const status =
        f.actualTime || f.status || "—";

      return `
        <div class="flightRow">

          <div class="flight">
            ${flight}
          </div>

          <div class="origin">
            ${origin}
          </div>

          <div class="bag">
            ${bag}
          </div>

          <div class="time">
            ${time}
          </div>

          <div class="status">
            ${status}
          </div>

        </div>
      `;

    }).join("");

    if (data.updated) {

      const updatedDate = new Date(data.updated);

      document.getElementById("updated").textContent =
        "DATA UPDATED " +
        updatedDate.toLocaleTimeString("en-US", {
          timeZone: "America/Jamaica",
          hour: "numeric",
          minute: "2-digit"
        });
    }

  } catch(error) {

    console.error(error);

    container.innerHTML =
      '<div class="loading">Unable to load current flight information.</div>';
  }
}

loadFlights();

/* Reloads our existing JSON every 5 minutes.
   This does NOT trigger Apify. */
setInterval(loadFlights, 300000);

</script>

</body>
</html>
