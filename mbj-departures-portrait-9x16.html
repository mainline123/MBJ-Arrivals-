<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MBJ | DEPARTURES</title><style>
:root{--navy:#061426;--blue:#0c2c49;--cyan:#45d5ff;--gold:#ffdb4b;--muted:#a9bfd1;--green:#5ff2a0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:white;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column}header{background:linear-gradient(145deg,#08213c,#104a72 72%,#08213c);padding:3.2vh 4.3vw 2.2vh;border-bottom:5px solid var(--gold)}.top{display:flex;align-items:center;justify-content:space-between}.code{font-weight:900;font-size:clamp(45px,10vw,110px);letter-spacing:-.055em;line-height:.9}.clock{text-align:right;font-size:clamp(17px,3.4vw,38px);font-weight:900;color:var(--gold)}.date{text-align:right;font-size:clamp(11px,2.2vw,24px);color:#d2e4f0;margin-top:6px}.airport{font-size:clamp(12px,2.5vw,29px);font-weight:800;letter-spacing:.09em;margin-top:2.2vh}.location{font-size:clamp(10px,1.9vw,21px);color:var(--cyan);letter-spacing:.15em;margin-top:.5vh}.headline{display:flex;align-items:center;gap:2vw;margin-top:2.5vh}.symbol{display:grid;place-items:center;background:var(--gold);color:#061426;width:11vw;height:11vw;max-width:118px;max-height:118px;border-radius:18px;font-size:clamp(30px,7vw,76px);font-weight:900}.headline h1{margin:0;font-size:clamp(35px,7.8vw,84px);letter-spacing:.025em;line-height:1}.live{font-size:clamp(10px,2vw,22px);color:var(--green);font-weight:800;letter-spacing:.12em;margin-top:.9vh}.table{flex:1;min-height:0;display:flex;flex-direction:column;padding:1.1vh 2.2vw 0}.cols,.flight{display:grid;grid-template-columns:3.05fr 1.65fr .68fr 1.02fr;align-items:center;gap:1vw}.cols{flex:none;height:5vh;padding:0 2vw;color:var(--cyan);font-size:clamp(11px,2vw,23px);font-weight:900;letter-spacing:.06em;background:#123a59;border-bottom:2px solid var(--cyan)}.cols span:last-child{text-align:right}.rows{display:flex;flex:1;min-height:0;flex-direction:column}.flight{flex:1;min-height:0;padding:0 2vw;border-bottom:1px solid #34516a;font-size:clamp(12px,2.35vw,28px);font-weight:800}.flight:nth-child(odd){background:#0b233c}.flight:nth-child(even){background:#12314d}.flight>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.flight .primary{font-weight:900;font-size:1.03em}.flight .time{text-align:right;color:var(--gold);font-weight:900}.flight .secondary{color:#e7f2fb}.flight .meta{color:var(--green);text-align:center}.status{font-size:.82em;color:#bdd2e0;margin-top:.35vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status.delay{color:#ffb84c}.status.cancel{color:#ff7777}.empty{display:grid;place-items:center;flex:1;color:#c9d9e5;text-align:center;padding:30px;font-size:clamp(18px,3vw,34px)}footer{min-height:7.5vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;border-top:3px solid var(--gold);background:#071b2d;text-align:center;padding:1vh 2vw}.company{color:var(--cyan);font-size:clamp(10px,1.9vw,22px);font-weight:900;letter-spacing:.035em}.footnote{font-size:clamp(10px,1.6vw,18px);color:var(--muted)}@media (max-aspect-ratio:7/10){header{padding-left:4vw;padding-right:4vw}.flight{font-size:2.7vw}.cols{font-size:2.2vw}}@media (min-aspect-ratio:8/10){header{padding-top:1vh;padding-bottom:1vh}.headline{margin-top:1vh}.airport{margin-top:1vh}.flight{font-size:2vw}}
</style></head><body><header><div class="top"><div class="code">MBJ</div><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></div><div class="airport">SANGSTER INTERNATIONAL AIRPORT</div><div class="location">MONTEGO BAY · JAMAICA</div><div class="headline"><div class="symbol">↗</div><h1>DEPARTURES</h1></div><div class="live">● FLIGHT INFORMATION · JAMAICA LOCAL TIME</div></header><main class="table"><div class="cols"><span>AIRLINE / FLIGHT</span><span>TO</span><span>GATE</span><span>TIME</span></div><div class="rows" id="rows"><div class="empty">Loading flight information…</div></div></main><footer><div class="company">HALIFAX VIRTUAL MEDIA MASTERS &amp; EVENTS LTD.</div><div class="footnote"><span id="updated">Connecting to MBJ flight feed…</span> · <span id="page"></span></div></footer><script>
'use strict';const SOURCE='departures.json',MAX_ROWS=12;let all=[],page=0,lastUpdate='';const el=id=>document.getElementById(id);function clean(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(){const n=new Date();el('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',hour:'numeric',minute:'2-digit',hour12:true}).format(n);el('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(n)}clock();setInterval(clock,1000);function minutes(t){const m=String(t||'').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return null;return (Number(m[1])%12+(m[3].toUpperCase()==='PM'?12:0))*60+Number(m[2])}function nowMinutes(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return Number(p.find(x=>x.type==='hour').value)*60+Number(p.find(x=>x.type==='minute').value)}function orderFlights(flights){const sorted=[...flights].sort((a,b)=>(minutes(a.scheduledTime)??9999)-(minutes(b.scheduledTime)??9999));let n=nowMinutes();let first=sorted.findIndex(f=>minutes(f.scheduledTime)!==null&&minutes(f.scheduledTime)>=n);if(first<0)first=Math.max(0,sorted.length-MAX_ROWS);return [...sorted.slice(Math.max(0,first-3)),...sorted.slice(0,Math.max(0,first-3))]}function render(){const pages=Math.max(1,Math.ceil(all.length/MAX_ROWS));page=page%pages;const subset=all.slice(page*MAX_ROWS,(page+1)*MAX_ROWS);el('page').textContent=all.length?`PAGE ${page+1} OF ${pages}`:'';if(!subset.length){el('rows').innerHTML='<div class="empty">No flights currently listed in the feed.</div>';return}el('rows').innerHTML=subset.map(f=>{const status=String(f.status||'');const cls=/cancel/i.test(status)?'cancel':/delay/i.test(status)?'delay':'';const detail=false?String(f.actualTime||f.status||''):String((f.actualTime?f.actualTime+' · ':'')+(f.status||''));return `<div class="flight"><div><div class="primary">${clean(f.airlineFlight||'—')}</div><div class="status ${cls}">${clean(detail||'&nbsp;')}</div></div><div class="secondary">${clean(false?f.from:f.to||'—')}</div><div class="meta">${clean((false?f.baggage:f.gate)||'—')}</div><div class="time">${clean(f.scheduledTime||'—')}</div></div>`}).join('')}async function load(){try{const response=await fetch(SOURCE+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.flights))throw Error('Missing flights array');all=orderFlights(data.flights);page=0;lastUpdate=data.updated||'';el('updated').textContent='FLIGHT DATA '+(lastUpdate?'UPDATED '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Jamaica',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(lastUpdate)):'CONNECTED');render()}catch(err){console.error('MBJ feed:',err);el('updated').textContent='DATA CONNECTION UNAVAILABLE';if(!all.length)el('rows').innerHTML='<div class="empty">Flight feed unavailable. Retrying automatically…</div>'}}load();setInterval(load,300000);setInterval(()=>{if(all.length){page++;render()}},15000);document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
