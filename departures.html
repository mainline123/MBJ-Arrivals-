<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moon Palace MBJ Departures</title>

<style>

:root {
    --navy:#06182c;
    --header:#063956;
    --gold:#f3d67a;
    --green:#42e582;
    --orange:#ffbd45;
    --red:#ff6464;
    --teal:#18c6c8;
    --cyan:#56c8ff;
    --line:rgba(201,166,75,.22);
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    background:transparent;
    color:white;
    font-family:Arial,"Segoe UI",sans-serif;
}

.board {
    width:100%;
    height:100vh;
    overflow:hidden;

    background:rgba(4,24,42,.97);

    display:flex;
    flex-direction:column;

    border:2px solid #c9a64b;
}


/* =========================================
   TABLE
   ========================================= */

.table-wrap {
    flex:1;
    min-height:0;
}

table {
    width:100%;
    height:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

thead {
    height:5%;
}

tbody {
    height:95%;
}


/* =========================================
   COLUMN HEADINGS
   ========================================= */

th {
    background:var(--header);
    color:var(--gold);

    font-size:clamp(15px,1.75vw,28px);
    font-weight:800;

    text-align:left;

    padding:8px 6px;

    border-bottom:2px solid #c9a64b;

    text-transform:uppercase;

    white-space:nowrap;
}


/* =========================================
   FLIGHT ROWS
   ========================================= */

td {
    padding:6px;

    border-bottom:
        1px solid var(--line);

    font-size:
        clamp(15px,1.75vw,28px);

    line-height:1.1;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

tbody tr:nth-child(even) {
    background:
        rgba(255,255,255,.025);
}


/* =========================================
   AIRLINE
   ========================================= */

.flight-cell {
    display:flex;
    align-items:center;

    gap:8px;

    width:100%;

    overflow:hidden;
}

.airline-logo {
    width:clamp(36px,4vw,60px);
    height:clamp(27px,3.2vw,46px);

    object-fit:contain;

    flex:0 0 auto;

    background:white;

    border-radius:4px;

    padding:2px;
}

.flight-text {
    font-weight:800;

    color:white;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================================
   CENTER SMALL COLUMNS
   ========================================= */

.center {
    text-align:center;
    font-weight:800;
}


/* =========================================
   SCHEDULED
   ========================================= */

.scheduled {
    font-weight:800;
    color:white;
}


/* =========================================
   STATUS
   ========================================= */

.status {
    font-weight:800;
}

.status-time {
    color:white;
    font-weight:800;
    margin-right:6px;
}

.status-on-time {
    color:var(--green);
}

.status-early {
    color:var(--teal);
}

.status-delayed {
    color:var(--orange);
}

.status-cancelled {
    color:var(--red);
}

.status-arrived,
.status-landed {
    color:var(--cyan);
}


/* =========================================
   COLUMN WIDTHS
   ========================================= */

.col-flight {
    width:28%;
}

.col-to {
    width:19%;
}

.col-checkin {
    width:13%;
}

.col-gate {
    width:7%;
}

.col-scheduled {
    width:14%;
}

.col-status {
    width:19%;
}


/* =========================================
   LIVE UPDATE BAR
   ========================================= */

.update-bar {
    flex:0 0 auto;

    background:var(--header);

    color:var(--gold);

    text-align:right;

    padding:4px 10px;

    font-size:
        clamp(10px,1.1vw,16px);

    font-weight:700;
}

</style>
</head>


<body>

<div class="board">

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th class="col-flight">
                        AIRLINE / FLIGHT
                    </th>

                    <th class="col-to">
                        TO
                    </th>

                    <th class="col-checkin">
                        CHECK-IN
                    </th>

                    <th class="col-gate">
                        GATE
                    </th>

                    <th class="col-scheduled">
                        SCHEDULED
                    </th>

                    <th class="col-status">
                        STATUS
                    </th>

                </tr>

            </thead>


            <tbody id="flightBody">
            </tbody>

        </table>

    </div>


    <div
        class="update-bar"
        id="updated">
        LIVE DATA
    </div>

</div>


<script>


/* =========================================
   AIRLINE LOGOS
   ========================================= */

const airlineLogos = {

    "AA":"AAL",
    "AC":"ACA",
    "B6":"JBU",
    "CM":"CMP",
    "DL":"DAL",
    "UA":"UAL",
    "WN":"SWA",
    "WS":"WJA",
    "VS":"VIR",
    "OR":"TFL",
    "BY":"TOM"

};


const LOGO_BASE =
"https://raw.githubusercontent.com/imgmongelli/airlines-logos-dataset/master/images/";


/* =========================================
   SAFE HTML
   ========================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =========================================
   STATUS CLASS
   ========================================= */

function statusClass(status) {

    return "status-" +

        String(status || "")

        .toLowerCase()

        .trim()

        .replace(/\s+/g,"-");
}


/* =========================================
   GET AIRLINE CODE
   ========================================= */

function getAirlineCode(value) {

    const text =

        String(value || "")
        .toUpperCase();


    const match =

        text.match(

            /\b([A-Z0-9]{2})\s*\d{1,4}\b/

        );


    return match
        ? match[1]
        : "";
}


/* =========================================
   GET AIRLINE LOGO
   ========================================= */

function getLogo(value) {

    const code =
        getAirlineCode(value);


    const icao =
        airlineLogos[code];


    if(!icao)
        return "";


    return (

        LOGO_BASE +

        encodeURIComponent(icao) +

        ".png"

    );
}


/* =========================================
   FORMAT UPDATE TIME
   ========================================= */

function formatUpdateTime(value) {

    if(!value)
        return "LIVE DATA";


    const date =
        new Date(value);


    if(isNaN(date.getTime()))
        return "LIVE DATA";


    return new Intl.DateTimeFormat(

        "en-US",

        {
            timeZone:
                "America/Jamaica",

            hour:
                "numeric",

            minute:
                "2-digit",

            hour12:
                true
        }

    ).format(date);
}


/* =========================================
   LOAD LIVE DEPARTURES
   ========================================= */

async function loadFlights() {

    try {


        const url =

            "./departures.json?refresh="

            +

            Date.now();


        const response =

            await fetch(

                url,

                {
                    cache:"no-store"
                }

            );


        if(!response.ok) {

            throw new Error(
                "Unable to retrieve departures"
            );
        }


        const data =

            await response.json();


        const flights =

            (data.flights || [])
            .slice(0,30);


        const body =

            document.getElementById(
                "flightBody"
            );


        body.innerHTML = "";


        flights.forEach(f => {


            const scheduledTime =

                f.scheduledTime
                ||
                "—";


            const status =

                f.status
                ||
                "Scheduled";


            /*
               UPDATED MBJ TIME APPEARS
               WITH THE STATUS.

               EXAMPLE:

               SCHEDULED
               1:00 PM

               STATUS
               1:26 PM Delayed
            */


            const statusDisplay =

                f.actualTime

                ? `

                    <span class="status-time">

                        ${escapeHtml(
                            f.actualTime
                        )}

                    </span>

                    <span class="${statusClass(status)}">

                        ${escapeHtml(
                            status
                        )}

                    </span>

                  `

                : `

                    <span class="${statusClass(status)}">

                        ${escapeHtml(
                            status
                        )}

                    </span>

                  `;


            const logo =

                getLogo(
                    f.airlineFlight
                );


            const logoHTML =

                logo

                ? `

                    <img
                        class="airline-logo"
                        src="${logo}"
                        alt=""
                        onerror="
                            this.style.display='none';
                        "
                    >

                  `

                : "";


            const row =

                document.createElement(
                    "tr"
                );


            row.innerHTML = `


                <td>

                    <div class="flight-cell">

                        ${logoHTML}

                        <span class="flight-text">

                            ${escapeHtml(
                                f.airlineFlight || "—"
                            )}

                        </span>

                    </div>

                </td>


                <td>

                    ${escapeHtml(
                        f.to || "—"
                    )}

                </td>


                <td class="center">

                    ${escapeHtml(
                        f.checkInCounters || "—"
                    )}

                </td>


                <td class="center">

                    ${escapeHtml(
                        f.gate || "—"
                    )}

                </td>


                <td class="scheduled">

                    ${escapeHtml(
                        scheduledTime
                    )}

                </td>


                <td class="status">

                    ${statusDisplay}

                </td>


            `;


            body.appendChild(row);

        });


        document
            .getElementById("updated")
            .textContent =

            "LIVE DATA UPDATED "

            +

            formatUpdateTime(
                data.updated
            );


    }


    catch(error) {


        console.error(
            "Departure update failed:",
            error
        );


        document
            .getElementById("updated")
            .textContent =

            "LIVE DATA — REFRESHING...";

    }

}


/* =========================================
   START
   ========================================= */

loadFlights();


/* REFRESH EVERY 60 SECONDS */

setInterval(
    loadFlights,
    60000
);


/* REFRESH WHEN NOVISIGN RETURNS */

document.addEventListener(

    "visibilitychange",

    function() {

        if(!document.hidden) {

            loadFlights();

        }

    }

);


</script>

</body>
</html>
