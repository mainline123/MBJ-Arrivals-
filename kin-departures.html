<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIN Live Departures</title>

<style>

:root {
    --header:#063956;
    --gold:#f3d67a;
    --green:#42e582;
    --orange:#ffbd45;
    --red:#ff6464;
    --cyan:#56c8ff;
    --teal:#18c6c8;
    --line:rgba(201,166,75,.22);
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
}

body {
    background:transparent;
    color:white;
    font-family:Arial,"Segoe UI",sans-serif;
}

.board {
    width:100%;
    height:100vh;
    overflow:hidden;

    background:rgba(4,24,42,.97);

    display:flex;
    flex-direction:column;

    border:2px solid #c9a64b;
}

.table-wrap {
    flex:1;
    min-height:0;
}

table {
    width:100%;
    height:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

thead {
    height:5%;
}

tbody {
    height:95%;
}

th {
    background:var(--header);
    color:var(--gold);

    font-size:clamp(15px,1.75vw,28px);
    font-weight:800;

    text-align:left;

    padding:8px 6px;

    border-bottom:2px solid #c9a64b;

    text-transform:uppercase;

    white-space:nowrap;
}

td {
    padding:6px;

    border-bottom:1px solid var(--line);

    font-size:clamp(15px,1.75vw,28px);

    line-height:1.1;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

tbody tr:nth-child(even) {
    background:rgba(255,255,255,.025);
}


/* AIRLINE / FLIGHT */

.flight-cell {
    display:flex;
    align-items:center;

    gap:8px;

    width:100%;

    overflow:hidden;
}

.airline-logo {
    width:clamp(36px,4vw,60px);
    height:clamp(27px,3.2vw,46px);

    object-fit:contain;

    flex:0 0 auto;

    background:white;

    border-radius:4px;

    padding:2px;
}

.flight-text {
    font-weight:800;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* CENTER COLUMNS */

.center {
    text-align:center;
    font-weight:800;
}


/* SCHEDULED */

.scheduled {
    color:white;
    font-weight:800;
}


/* STATUS */

.status {
    font-weight:800;
}

.status-time {
    color:white;
    font-weight:800;

    margin-right:6px;
}

.status-on-time,
.status-ontime {
    color:var(--green);
}

.status-early {
    color:var(--teal);
}

.status-delayed {
    color:var(--orange);
}

.status-cancelled {
    color:var(--red);
}

.status-departed,
.status-landed,
.status-arrived {
    color:var(--cyan);
}


/* COLUMN WIDTHS */

.col-flight {
    width:28%;
}

.col-to {
    width:19%;
}

.col-checkin {
    width:13%;
}

.col-gate {
    width:7%;
}

.col-time {
    width:14%;
}

.col-status {
    width:19%;
}


/* UPDATE BAR */

.update-bar {
    flex:0 0 auto;

    background:var(--header);

    color:var(--gold);

    text-align:right;

    padding:5px 10px;

    font-size:clamp(10px,1.1vw,16px);

    font-weight:700;
}

</style>
</head>


<body>

<div class="board">

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th class="col-flight">
                        AIRLINE / FLIGHT
                    </th>

                    <th class="col-to">
                        TO
                    </th>

                    <th class="col-checkin">
                        CHECK-IN
                    </th>

                    <th class="col-gate">
                        GATE
                    </th>

                    <th class="col-time">
                        SCHEDULED
                    </th>

                    <th class="col-status">
                        STATUS
                    </th>

                </tr>

            </thead>


            <tbody id="flightBody">
            </tbody>

        </table>

    </div>


    <div
        class="update-bar"
        id="updated">
        LIVE KIN DATA
    </div>

</div>


<script>


/* =========================================
   SALMAN'S EXISTING LIVE KIN DEPARTURE DATA
   ========================================= */

const LIVE_URL =
"https://mainline123.github.io/travis-airports/data/kin-departures.json";


/* =========================================
   AIRLINE LOGOS
   ========================================= */

const airlineLogos = {

    "AA":"AAL",
    "AC":"ACA",
    "B6":"JBU",
    "BA":"BAW",
    "BW":"BWA",
    "CM":"CMP",
    "DL":"DAL",
    "DM":"ARA",
    "JY":"IWY",
    "KX":"CAY",
    "NK":"NKS",
    "UA":"UAL"

};


const LOGO_BASE =
"https://raw.githubusercontent.com/imgmongelli/airlines-logos-dataset/master/images/";


/* =========================================
   SAFE HTML
   ========================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =========================================
   GET FIELD
   ========================================= */

function getValue(object,names) {

    for(const name of names) {

        if(
            object[name] !== undefined &&
            object[name] !== null &&
            object[name] !== ""
        ) {

            return object[name];

        }

    }

    return "";
}


/* =========================================
   AIRLINE CODE
   ========================================= */

function getAirlineCode(value) {

    const text =
        String(value || "")
        .toUpperCase();


    const match =
        text.match(
            /\b([A-Z0-9]{2})\s*\d{1,4}\b/
        );


    return match
        ? match[1]
        : "";
}


/* =========================================
   AIRLINE LOGO
   ========================================= */

function getLogo(value) {

    const code =
        getAirlineCode(value);


    const icao =
        airlineLogos[code];


    if(!icao) {
        return "";
    }


    return (
        LOGO_BASE +
        encodeURIComponent(icao) +
        ".png"
    );
}


/* =========================================
   STATUS COLOUR
   ========================================= */

function statusClass(status) {

    const value =
        String(status || "")
        .toLowerCase();


    if(value.includes("departed")) {
        return "status-departed";
    }


    if(value.includes("landed")) {
        return "status-landed";
    }


    if(value.includes("arrived")) {
        return "status-arrived";
    }


    if(value.includes("early")) {
        return "status-early";
    }


    if(value.includes("delay")) {
        return "status-delayed";
    }


    if(value.includes("cancel")) {
        return "status-cancelled";
    }


    if(
        value.includes("on-time") ||
        value.includes("on time")
    ) {

        return "status-on-time";

    }


    return "";
}


/* =========================================
   UPDATE TIME
   ========================================= */

function formatUpdateTime(value) {

    if(!value) {
        return "";
    }


    const date =
        new Date(value);


    if(isNaN(date.getTime())) {
        return "";
    }


    return new Intl.DateTimeFormat(

        "en-US",

        {
            timeZone:"America/Jamaica",
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }

    ).format(date);
}


/* =========================================
   LOAD LIVE KIN DEPARTURES
   ========================================= */

async function loadFlights() {

    try {


        const response =
            await fetch(

                LIVE_URL +
                "?refresh=" +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok) {

            throw new Error(
                "Unable to retrieve KIN departures"
            );

        }


        const data =
            await response.json();


        const flights =
            (data.flights || [])
            .slice(0,30);


        const body =
            document.getElementById(
                "flightBody"
            );


        body.innerHTML = "";


        flights.forEach(f => {


            const airlineFlight =
                getValue(
                    f,
                    [
                        "airlineFlight",
                        "airline_flight",
                        "flight"
                    ]
                );


            const destination =
                getValue(
                    f,
                    [
                        "to",
                        "destination",
                        "departingTo"
                    ]
                );


            const checkIn =
                getValue(
                    f,
                    [
                        "checkInCounters",
                        "checkin",
                        "checkIn",
                        "counter",
                        "counters"
                    ]
                );


            const gate =
                getValue(
                    f,
                    [
                        "gate",
                        "gateNumber"
                    ]
                );


            const scheduledTime =
                getValue(
                    f,
                    [
                        "scheduledTime",
                        "scheduled",
                        "time"
                    ]
                );


            const actualTime =
                getValue(
                    f,
                    [
                        "actualTime",
                        "actual",
                        "estimatedTime"
                    ]
                );


            const status =
                getValue(
                    f,
                    [
                        "status",
                        "flightStatus"
                    ]
                ) || "On-Time";


            /*
               STATUS TIME

               If KIN provides an updated /
               actual departure time, use it.

               Otherwise repeat the scheduled
               time beside On-Time.

               Examples:

               11:20 AM On-Time

               10:20 AM Departed
            */


            const statusTime =
                actualTime ||
                scheduledTime ||
                "";


            const logo =
                getLogo(
                    airlineFlight
                );


            const logoHTML =
                logo

                ? `

                    <img
                        class="airline-logo"
                        src="${logo}"
                        alt=""
                        onerror="
                            this.style.display='none';
                        "
                    >

                  `

                : "";


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `


                <td>

                    <div class="flight-cell">

                        ${logoHTML}

                        <span class="flight-text">

                            ${escapeHtml(
                                airlineFlight || "—"
                            )}

                        </span>

                    </div>

                </td>


                <td>

                    ${escapeHtml(
                        destination || "—"
                    )}

                </td>


                <td class="center">

                    ${escapeHtml(
                        checkIn || "—"
                    )}

                </td>


                <td class="center">

                    ${escapeHtml(
                        gate || "—"
                    )}

                </td>


                <td class="scheduled">

                    ${escapeHtml(
                        scheduledTime || "—"
                    )}

                </td>


                <td class="status">

                    <span class="status-time">

                        ${escapeHtml(
                            statusTime
                        )}

                    </span>

                    <span class="${statusClass(status)}">

                        ${escapeHtml(
                            status
                        )}

                    </span>

                </td>


            `;


            body.appendChild(row);

        });


        const updateTime =
            formatUpdateTime(
                data.updated
            );


        document
            .getElementById("updated")
            .textContent =

            updateTime

            ? "LIVE KIN DATA UPDATED " +
              updateTime

            : "LIVE KIN DATA";


    }


    catch(error) {


        console.error(
            "KIN departure update failed:",
            error
        );


        document
            .getElementById("updated")
            .textContent =

            "LIVE KIN DATA — REFRESHING...";

    }

}


/* LOAD NOW */

loadFlights();


/* REFRESH EVERY 60 SECONDS */

setInterval(
    loadFlights,
    60000
);


/* REFRESH WHEN NOVISIGN RETURNS */

document.addEventListener(

    "visibilitychange",

    function() {

        if(!document.hidden) {

            loadFlights();

        }

    }

);


</script>

</body>
</html>
